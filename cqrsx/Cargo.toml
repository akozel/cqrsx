[package]
name = "cqrsx"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[features]
default = ["postgres", "worker"]
host = ["worker", "tokio/signal"]
http = ["host", "dep:axum", "dep:tower-http", "tokio/net"]
logging = ["dep:tracing-subscriber"]
mongodb = ["dep:mongodb"]
postgres = ["dep:sqlx", "dep:futures"]
worker = ["dep:async-channel", "tokio/rt", "tokio/sync"]

[dependencies]
async-channel = { version = "2.5.0", optional = true }
async-trait = "0.1.92"
axum = { version = "0.8.9", optional = true }
chrono = { version = "0.4.45", features = ["serde"] }
cqrsx-macros = { path = "../cqrsx-macros", version = "0.1.0" }
futures = { version = "0.3.34", optional = true }
mongodb = { version = "3.9.1", default-features = false, features = ["compat-3-0-0", "rustls-tls"], optional = true }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = { version = "0.10.7", default-features = false }
sqlx = { version = "0.8.6", default-features = false, features = ["json", "chrono", "uuid", "postgres", "runtime-tokio-rustls"], optional = true }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["time", "macros", "rt", "sync"] }
tokio-util = { version = "0.7.19", default-features = false }
tower-http = { version = "0.7.1", features = ["trace"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", optional = true }
uuid = { version = "1.26.1", features = ["serde", "v4", "v7"] }

[dev-dependencies]
proptest = "=1.12.0"
log = "0.4.34"
testcontainers = "0.28.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Rules of .claude/rules/rust-style.md: every public type is `Debug` (16), no `unsafe` (32).
[lints.rust]
missing_debug_implementations = "deny"
unsafe_code = "forbid"

# No panics outside tests (rules 6–8); tests are allowed by clippy.toml. A function that only reads an argument
# borrows it (3); a builder method's result is used (20).
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
needless_pass_by_value = "deny"
return_self_not_must_use = "deny"
