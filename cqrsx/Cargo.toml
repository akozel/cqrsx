[package]
name = "cqrsx"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
async-channel.workspace = true
async-trait.workspace = true
chrono.workspace = true
cqrsx-macros.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
# The backend in memory and the test tools of an application (`testing`), for tests: the crate's own tests always see them
# (`cfg(test)`), the tests of the other crates and of the application enable them. A working build has no use for them.
test-utils = []

[dev-dependencies]
# The crate's integration tests and doctests get the backend in memory.
cqrsx = { path = ".", features = ["test-utils"] }
cqrsx-fixtures.workspace = true
log.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util"] }

[lints]
workspace = true
