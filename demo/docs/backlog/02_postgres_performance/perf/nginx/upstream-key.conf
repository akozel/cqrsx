# NODES=2 BALANCE=key: every request for one aggregate goes to the same node (consistent hashing of
# $aggregate_key, nginx.conf), so each aggregate has a single writing process.
upstream backend_nodes {
    hash $aggregate_key consistent;
    server backend:8080;
    server backend-2:8080;
    keepalive 64;
    keepalive_requests 1000000;
}
