# The stand's balancer in front of the back-end nodes (compose.balancer.yaml, ticket 17).
# One worker: the balancer has one core of CPU quota, more workers would only contend for it.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    # No access log: a line per request costs CPU on the measured path. Which node answered is in the
    # X-Upstream response header instead (the distribution check reads it).
    access_log off;
    # Client connections (k6, wrk) live as long as a run, like the direct connections to the back-end.
    keepalive_timeout 75s;
    keepalive_requests 1000000;

    # The aggregate a request addresses, for `hash` in upstream-key.conf:
    # /api/concerts/{id}/… → concerts:{id}, /api/fans/{id}/… → fans:{id}; anything else by its path.
    map $uri $aggregate_key {
        ~^/api/(?<kind>concerts|fans)/(?<id>[^/]+)  $kind:$id;
        default                                     $uri;
    }

    # upstream backend_nodes: one of upstream-*.conf, chosen by perf/run.sh (PERF_UPSTREAM).
    include /etc/nginx/upstream.conf;

    server {
        listen 8080;

        location = /balancer/health {
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://backend_nodes;
            # Keep-alive to the nodes (`keepalive` in the upstream) needs HTTP/1.1 and no Connection header.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # POSTs are never retried on another node (nginx's default): a command runs at most once.
            add_header X-Upstream $upstream_addr always;
        }
    }
}
