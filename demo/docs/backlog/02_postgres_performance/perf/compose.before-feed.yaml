# The "before" image of epic 03/02 for the hot-key measurement of 03/03: the stand's schema is applied from the
# working tree, then 15-before-feed.sql removes events.tx and events_feed_idx (initdb runs the scripts in name
# order: 05 statements, 10 event store, 15 this one, 20 outbox). Pass it through LOAD_COMPOSE_EXTRA next to
# compose.perf.yaml; LOAD_HOST_DIR is the host path of demo/load.
services:
  postgres:
    volumes:
      - ${LOAD_HOST_DIR:-.}/../docs/backlog/02_postgres_performance/perf/postgres/15-before-feed.sql:/docker-entrypoint-initdb.d/15-before-feed.sql:ro,z
