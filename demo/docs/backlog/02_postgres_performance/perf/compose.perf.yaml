# The epic's overlay on demo/load/compose.yaml (perf/run.sh passes it as LOAD_COMPOSE_EXTRA):
# pg_stat_statements and I/O timing for the per-command figures. They cost a little CPU themselves, so
# compare only with runs measured the same way (the perf-base- batch on). Relative paths resolve against
# demo/load, the directory of the first compose file; LOAD_HOST_DIR is the host path of demo/load.
services:
  postgres:
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "track_io_timing=on"]
    volumes:
      - ${LOAD_HOST_DIR:-.}/../docs/backlog/02_postgres_performance/perf/postgres/00-pg-stat-statements.sql:/docker-entrypoint-initdb.d/05-pg-stat-statements.sql:ro,z
