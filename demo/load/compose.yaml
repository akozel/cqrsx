# Isolated load-test stand for the Encore back-end (see README.md).
#
# - No published ports: everything talks over the compose network, k6 runs inside it.
# - No sidecar, no front-end: `mail` is an nginx stub that delivers every e-mail at once, so the
#   numbers are about the back-end, PostgreSQL and MongoDB only.
# - A fresh stand per run: run.sh does `down -v` before and after, so the databases start empty and
#   their anonymous volumes are dropped with the containers.
# - CPU pinning lives in compose.pin.yaml (run.sh adds it unless PIN=0).
# - Bind-mount sources are prefixed with LOAD_HOST_DIR: when compose runs somewhere other than the
#   machine that runs the containers (a sandbox talking to the host's podman socket), it must name
#   the host's path of this directory. Unset, `.` is the usual relative resolution.
name: encore-load
services:
  postgres:
    image: docker.io/library/postgres:18.6-alpine   # the same image as demo/compose.yaml
    environment:
      POSTGRES_USER: cqrsx
      POSTGRES_PASSWORD: cqrsx
      POSTGRES_DB: encore
    volumes:
      # The library's own schemas, exactly as the demo mounts them. No inspector/admin roles here:
      # there is no sidecar on this stand.
      - ${LOAD_HOST_DIR:-.}/../../cqrsx/sql/001-event-store.sql:/docker-entrypoint-initdb.d/10-event-store.sql:ro,z
      - ${LOAD_HOST_DIR:-.}/../../cqrsx/sql/002-transactional-outbox.sql:/docker-entrypoint-initdb.d/20-outbox.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cqrsx -d encore"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo:
    image: docker.io/library/mongo:8.2
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The external mail service, stubbed: `POST /mail` answers 200 at once (mail/nginx.conf).
  mail:
    image: docker.io/library/nginx:1.30.6-alpine
    volumes:
      - ${LOAD_HOST_DIR:-.}/mail/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 2s
      timeout: 3s
      retries: 15

  # The back-end, release build from the demo Dockerfile (build context = repository root).
  backend:
    build:
      context: ../..
      dockerfile: demo/back-end/Dockerfile
    image: encore-load-backend
    environment:
      ENCORE_HTTP_ADDR: 0.0.0.0:8080
      ENCORE_DATABASE_URL: postgresql://cqrsx:cqrsx@postgres:5432/encore
      ENCORE_MONGODB_URI: mongodb://mongo:27017
      ENCORE_MAIL_SERVICE_URL: http://mail
      ENCORE_SNAPSHOT_EVERY: ${LOAD_SNAPSHOT_EVERY:-10}
      # The owner name in the projections' checkpoints; the second node overrides it.
      ENCORE_NODE_NAME: backend
      # The aggregate lock's limits (run.sh LOCK_MAX_WAIT_MS=…, LOCK_MAX_WAITERS=…).
      # Empty = the back-end's default. Here, not in an overlay, so a second node (`extends`) gets them too.
      ENCORE_COMMAND_LOCK_MAX_WAIT_MS: ${LOAD_LOCK_MAX_WAIT_MS:-}
      ENCORE_COMMAND_LOCK_MAX_WAITERS: ${LOAD_LOCK_MAX_WAITERS:-}
      # The projection buffers (run.sh PROJECTION_BUFFER=…, PROJECTION_MAX_BATCH=…).
      ENCORE_PROJECTION_BUFFER: ${LOAD_PROJECTION_BUFFER:-}
      ENCORE_PROJECTION_MAX_BATCH: ${LOAD_PROJECTION_MAX_BATCH:-}
      # The pause after a commit's wake-up before the processor reads (run.sh PROJECTION_SETTLE_MS=…).
      ENCORE_PROJECTION_SETTLE_MS: ${LOAD_PROJECTION_SETTLE_MS:-}
      # The one PostgreSQL pool shared by HTTP, the poller and the workers: the ceiling of concurrent
      # database work (run.sh POOL=…).
      ENCORE_DATABASE_POOL_SIZE: ${LOAD_PG_POOL:-10}
      # Workers = queue capacity. With Q = C the lease budget 2*S + H + 5s + ceil(Q/C)*(H+S) = 24 s
      # stays below the default 30 s lease for any worker count.
      OUTBOX_WORKER_CONCURRENCY: ${LOAD_OUTBOX_WORKERS:-2}
      OUTBOX_QUEUE_CAPACITY: ${LOAD_OUTBOX_WORKERS:-2}
      OUTBOX_POLL_INTERVAL_MS: ${LOAD_OUTBOX_POLL_MS:-300}
      # `warn`: the request trace layer logs every request at info, which costs CPU on two cores.
      RUST_LOG: ${LOAD_RUST_LOG:-warn}
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      mail: { condition: service_healthy }

  # k6 is never started by `up`; run.sh starts it with `compose run k6 run /scripts/<test>.js`.
  k6:
    image: ${LOAD_K6_IMAGE:-docker.io/grafana/k6:1.8.2}
    volumes:
      - ${LOAD_HOST_DIR:-.}/k6:/scripts:ro,z
    environment:
      BASE_URL: http://backend:8080
    depends_on:
      backend: { condition: service_healthy }
