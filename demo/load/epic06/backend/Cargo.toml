[package]
name = "epic06-backend"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The load stand's back-end of backlog epic 06: the demo's box office and the synthetic module probe"

[dependencies]
# The demo's library: its modules, its defaults and its HTTP error shape. Its features of cqrsx are the demo's.
encore-backend = { path = "../../../back-end" }
cqrsx = { path = "../../../../cqrsx", features = ["http", "logging", "mongodb"] }
axum = "0.8"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# The demo back-end's.
[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
