[package]
name = "epic06-allocations"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Backlog epic 06: allocations of the typical scenario on cqrsx's engine in memory (one ignored test)"

# Only the test `tests/allocations.rs`, on cqrsx with its default features, as `cargo test -p cqrsx` builds it.
[dev-dependencies]
cqrsx = { path = "../../../../cqrsx" }
serde = { version = "1", features = ["derive"] }
stats_alloc = "0.1.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "test-util", "time"] }

# cqrsx's: the test was one of its integration tests and keeps their `#![allow(..)]`.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
