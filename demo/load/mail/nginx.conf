# The external mail service as a stub: every POST /mail is delivered at once. The back-end's
# contract (demo/back-end/src/infrastructure/mail): 2xx { inbox_id, duplicate } means done. No
# chaos, no latency, no inbox: the load numbers must be about the back-end and its databases.
server {
    listen 80;
    access_log off;

    location = /mail {
        default_type application/json;
        return 200 '{"inbox_id":"stub","duplicate":false}';
    }

    location = /health {
        return 200 'ok';
    }

    location / {
        return 404;
    }
}
