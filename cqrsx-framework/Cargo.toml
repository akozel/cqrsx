[package]
name = "cqrsx-framework"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "The framework of cqrsx: the application's modules assembled into one application over the stores in PostgreSQL and MongoDB, or in memory for tests"

[features]
default = ["event-store-postgres"]
# The journal, the snapshots, the outbox and the task queue in PostgreSQL: the marker `Postgres` of `event_store(..)`.
event-store-postgres = ["dep:sqlx", "dep:async-trait", "dep:chrono", "dep:futures"]
# The views and their checkpoints in PostgreSQL: the marker `Postgres` of `projections(..)`.
projections-postgres = ["event-store-postgres"]
# The views and their checkpoints in MongoDB: the marker `MongoDb` of `projections(..)`.
projections-mongodb = ["event-store-postgres", "dep:mongodb"]
axum = ["dep:axum", "dep:tower-http", "dep:tracing-subscriber", "tokio/net", "tokio/signal"]
operation-utils = []
test-utils = ["cqrsx/test-utils"]

[dependencies]
async-trait = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
cqrsx.workspace = true
futures = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http = { workspace = true, optional = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
uuid.workspace = true

[dev-dependencies]
# The crate's own tests (unit, `tests/*`, the README doctest) get the helpers of `test-utils`.
cqrsx-framework = { path = ".", default-features = false, features = ["test-utils"] }
cqrsx-fixtures.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
mongodb.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util"] }
tracing = { workspace = true, features = ["log"] }
uuid.workspace = true

[lints]
workspace = true
