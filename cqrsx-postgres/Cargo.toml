[package]
name = "cqrsx-postgres"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "The PostgreSQL stores of cqrsx: event repository, outbox publication, task queue, projection checkpoints, views"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
