[package]
name = "cqrsx-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Derive macros of cqrsx (Command, Commands, Event, Events, Task, Rejection) and its #[task_handler] attribute"

[lib]
proc-macro = true

[dependencies]
heck = "0.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }

# Rules of .claude/rules/rust-style.md: every public type is `Debug` (16), no `unsafe` (32).
[lints.rust]
missing_debug_implementations = "deny"
unsafe_code = "forbid"

# No panics outside tests (rules 6–8); tests are allowed by clippy.toml. A function that only reads an argument
# borrows it (3); a builder method's result is used (20).
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
needless_pass_by_value = "deny"
return_self_not_must_use = "deny"
