[package]
name = "cqrsx-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
description = "Derive macros of cqrsx (Command, Commands, Event, Events, Task, Rejection) and its #[task_handler] attribute"

[lib]
proc-macro = true

[dependencies]
heck = "0.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }

# No panics outside tests (rules 6–8 of .claude/rules/rust-style.md); tests are allowed by clippy.toml.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
